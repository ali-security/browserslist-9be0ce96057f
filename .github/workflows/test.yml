name: Test
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: uvu test name pattern; empty runs the whole suite
        required: false
        default: ''
permissions:
  contents: read
jobs:
  full:
    name: Node.js Latest Full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 21
          cache: pnpm
      - name: Point npm at the registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2024-02-14T17:50:55.881000Z
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Run tests
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: '1'
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            NODE_ENV=test ./node_modules/.bin/uvu test "${{ inputs.test-filter }}"
          else
            pnpm unit
            pnpm run test:lint
            pnpm run test:size
          fi
      - name: Pack the tarball
        run: |
          npx clean-publish --without-publish --temp-dir "$RUNNER_TEMP/clean-package"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd "$RUNNER_TEMP/clean-package"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"
      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist/browserslist-*.tgz
          if-no-files-found: error
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version:
          - 20
          - 18
          - 16
    name: Node.js ${{ matrix.node-version }} Quick
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Point npm at the registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2024-02-14T17:50:55.881000Z
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Run unit tests
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: '1'
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            NODE_ENV=test ./node_modules/.bin/uvu test "${{ inputs.test-filter }}"
          else
            pnpm unit
          fi
  old:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version:
          - 14
          - 12
          - 10
          - 8
    name: Node.js ${{ matrix.node-version }} Quick
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v1
        with:
          version: 3
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Point npm at the registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2024-02-14T17:50:55.881000Z
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Run unit tests
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: '1'
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            NODE_ENV=test ./node_modules/.bin/uvu -r uvu test "${{ inputs.test-filter }}"
          else
            pnpm run unit:old
          fi
